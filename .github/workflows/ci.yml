name: Test and Report

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 22
        uses: actions/setup-java@v3
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and test with Maven
        run: |
          mvn clean test
          mvn allure:report
        continue-on-error: true
#          if [[ "$RUNNER_OS" == "Linux" ]]; then
#            echo "Running tests with Linux driver"
#            mvn clean test -Dwebdriver.chrome.driver=$(pwd)/src/main/resources/chromedriver
#          elif [[ "$RUNNER_OS" == "Windows" ]]; then
#            echo "Running tests with Windows driver"
#            mvn clean test -Dwebdriver.chrome.driver=$(pwd)/src/main/resources/chromedriver.exe
#          else
#            echo "Unsupported OS"
#            exit 1
#          fi

      - name: Archive Allure results
        uses: actions/upload-artifact@v3
        if: always()
        with:
         name: allure-results
         path: target/allure-results

      - name: Generate Allure Report
        run: |
          mvn allure:serve
          continue-on-error: true

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: target/site/allure-maven-plugin
            keep_files: true
            destination_dir: reports

      - name: Notify completion
        run: echo "Build and tests completed!"